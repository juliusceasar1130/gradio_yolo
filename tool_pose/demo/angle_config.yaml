# ==============================================================================
# YOLO Pose 预测配置文件（统一配置）
# ==============================================================================
# 修改时间：2025年1月31日
# 最后更新：2025年11月2日
# 说明：所有配置参数统一在此文件中，修改方便醒目
# ==============================================================================

# ==============================================================================
# 路径配置（必填：请根据实际情况修改）
# ==============================================================================
paths:
  # 模型文件路径（.pt文件）
  model: "D:\\00deeplearn\\yolo11\\gradio_web_yolo\\tool_pose\\tools\\train2\\weights\\best.pt"
  
  # 输入图片路径
  image: "C:\\Users\\julius\\Desktop\\张春亮\\zcl\\GG5087612_01_20251028152549437.jpg"
  
  # 输出目录（自动创建）
  output: "outputs"

# ==============================================================================
# 预测参数（可选：使用默认值或根据需求调整）
# ==============================================================================
predict:
  # 置信度阈值 [0.0-1.0]，越低检测越多但可能包含误检
  conf: 0.25
  
  # IoU阈值 [0.0-1.0]，用于非极大值抑制（NMS）
  iou: 0.45
  
  # 图像尺寸（像素），推荐：640, 1280，越大精度越高但速度越慢
  imgsz: 640
  
  # 设备：""=自动选择, "cuda"=GPU, "cpu"=CPU
  device: ""
  
  # 半精度推理：true=加速但精度略降, false=全精度
  half: false
  
  # 最大检测数量
  max_det: 1000

# ==============================================================================
# 输出选项（可选：控制结果保存和显示）
# ==============================================================================
output:
  # 是否显示结果图片
  show_image: true
  
  # 是否保存标注后的图片
  save_image: false
  
  # 是否保存JSON结果文件
  save_json: true

# ==============================================================================
# 类别和关键点配置
# ==============================================================================
# 类别名称映射（从类别ID到类别名称）
names:
  0: tool1
  1: tool2

# 关键点名称映射（每个类别ID对应的关键点名称列表）
kpt_names:
  0:
    - t1_1
    - t1_2
    - t1_3
    - t1_4
    - t1_5
    - t1_6
    - t1_7
  1:
    - t2_1
    - t2_2
    - t2_3
    - t2_4
    - t2_5
    - t2_6
    - t2_7

# ==============================================================================
# 角度定义（必填：根据实际需求定义角度）
# ==============================================================================
# 每个角度由三个关键点名称定义：[起点, 顶点, 终点]
# 顶点是角度计算的顶点位置
angles:
  tool1:
    angle1: [t1_1, t1_2, t1_3]
    angle2: [t1_2, t1_3, t1_4]
    angle3: [t1_3, t1_4, t1_5]
    angle4: [t1_4, t1_5, t1_6]
    angle5: [t1_5, t1_6, t1_7]

  tool2:
    angle1: [t2_1, t2_2, t2_3]
    angle2: [t2_2, t2_3, t2_4]
    angle3: [t2_3, t2_4, t2_5]
    angle4: [t2_4, t2_5, t2_6]
    angle5: [t2_5, t2_6, t2_7]
